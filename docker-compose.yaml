services:
  vpnbot:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/vpnbot/Dockerfile
    container_name: vpnbot
    user: ${DOCKER_USER}
    depends_on:
      vpnbot-postgres:
        condition: service_healthy
    network_mode: host
    environment:
      - TG_TOKEN=${TG_TOKEN}
      - TG_PROXY_ADDR=${TG_PROXY_ADDR}
      - TG_POLL_TIMEOUT=${TG_POLL_TIMEOUT}
      - TG_SHUTDOWN_TIMEOUT=${TG_SHUTDOWN_TIMEOUT}
      - TG_SUPER_ADMIN_ID=${TG_SUPER_ADMIN_ID}
      - TG_ADMIN_CONTACT=${TG_ADMIN_CONTACT}
      - PAYMENT_CARD_NUMBER=${PAYMENT_CARD_NUMBER}
      - PAYMENT_PHONE=${PAYMENT_PHONE}
      - PAYMENT_BANK=${PAYMENT_BANK}
      - PAYMENT_RECIPIENT=${PAYMENT_RECIPIENT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    restart: always
    
  vpnbot-postgres:
    image: postgres:18.6-bookworm
    container_name: vpnbot-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/.pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: always

  vpnbot-postgres-migrate:
    image: migrate/migrate:v4.19.1
    user: ${DOCKER_USER}
    depends_on:
      vpnbot-postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: vpnbot-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:vpnbot-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"