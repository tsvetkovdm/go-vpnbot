services:
  vpnbot-postgres:
    image: postgres:18.6-bookworm
    container_name: vpnbot-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/.pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: always

  vpnbot-postgres-migrate:
    image: migrate/migrate:v4.19.1
    user: ${DOCKER_USER}
    depends_on:
      vpnbot-postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: vpnbot-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:vpnbot-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"